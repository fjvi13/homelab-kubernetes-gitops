# For installation and configuration options, refer to the [installation instructions](https://github.com/elastic/opentelemetry/blob/main/docs/kubernetes/operator/README.md)

# For advanced configuration options, refer to the [official OpenTelemetry Helm chart](https://github.com/open-telemetry/opentelemetry-helm-charts/blob/main/charts/opentelemetry-kube-stack/values.yaml)
# This file has been tested together with opentelemetry-kube-stack helm chart version: 0.3.3
opentelemetry-operator:
  revisionHistoryLimit: 1
  replicaCount: 1
  manager:
    image:
      repository: "ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator"
      tag: "0.152.0"
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
        ephemeral-storage: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 128Mi
    extraArgs:
      - --enable-go-instrumentation
  admissionWebhooks:
    certManager:
      enabled: false # For production environments, it is [recommended to use cert-manager for better security and scalability](https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-operator#tls-certificate-requirement).
    autoGenerateCert:
      enabled: true # Enable/disable automatic certificate generation. Set to false if manually managing certificates.
      recreate: true # Force certificate regeneration on updates. Only applicable if autoGenerateCert.enabled is true.
crds:
  create: true # Install the OpenTelemetry Operator CRDs.
defaultCRConfig:
  image:
    repository: "docker.elastic.co/elastic-agent/elastic-agent"
    tag: "9.4.2"
  targetAllocator:
    enabled: false # Enable/disable the Operator's Target allocator.
    # Refer to: https://github.com/open-telemetry/opentelemetry-operator/tree/main/cmd/otel-allocator
  volumes:
    - name: scratch
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            storageClassName: topolvm-provisioner
            resources:
              requests:
                storage: 1Gi
  volumeMounts:
    - name: scratch
      mountPath: /var/lib/otelcol-scratch
  observability:
    metrics:
      enableMetrics: true
clusterRole:
  rules:
    - apiGroups: [""]
      resources: ["configmaps"]
      verbs: ["get"]
    # Required by the k8s_events receiver
    - apiGroups: [""]
      resources: ["events"]
      verbs: ["get", "list", "watch"]
    # Strategy B kubelet scraping (prometheus collector):
    # `role: node` service discovery for the kubelet/cadvisor/probes scrape jobs.
    - apiGroups: [""]
      resources: ["nodes"]
      verbs: ["get", "list", "watch"]
    # The kubelet delegates authz to the API server; scraping /metrics, /metrics/cadvisor
    # and /metrics/probes on :10250 is authorized via the nodes/metrics subresource.
    - apiGroups: [""]
      resources: ["nodes/metrics"]
      verbs: ["get"]
    # - apiGroups:
    #     - monitoring.coreos.com
    #   resources:
    #     - servicemonitors
    #     - podmonitors
    #   verbs:
    #     - '*'
    # - apiGroups: ['']
    #   resources:
    #     - namespaces
    #   verbs: ['get', 'list', 'watch']
    # - apiGroups: ['']
    #   resources:
    #     - nodes
    #     - nodes/metrics
    #     - services
    #     - endpoints
    #     - pods
    #   verbs: ['get', 'list', 'watch']
    # - apiGroups: ['']
    #   resources:
    #     - configmaps
    #   verbs: ['get']
    # - apiGroups:
    #     - discovery.k8s.io
    #   resources:
    #     - endpointslices
    #   verbs: ['get', 'list', 'watch']
    # - apiGroups:
    #     - networking.k8s.io
    #   resources:
    #     - ingresses
    #   verbs: ['get', 'list', 'watch']
    # - nonResourceURLs: ['/metrics']
    #   verbs: ['get']

    # # Required by the prometheus receiver (used by the prometheus collector)
    # - apiGroups: [""]
    #   resources:
    #     - "nodes"
    #     - "nodes/metrics"
    #     - "services"
    #     - "endpoints"
    #     - "pods"
    #   verbs: ["get", "list", "watch"]
    # - apiGroups: ["discovery.k8s.io"]
    #   resources: ["endpointslices"]
    #   verbs: ["get", "list", "watch"]
    # - apiGroups: ["networking.k8s.io"]
    #   resources: ["ingresses"]
    #   verbs: ["get", "list", "watch"]
    # # Required for scraping kubelet metrics and cAdvisor via SA token
    # - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    #   verbs: ["get"]
# `clusterName` specifies the name of the Kubernetes cluster. It sets the 'k8s.cluster.name' field.
# Cluster Name is automatically detected for EKS/GKE/AKS. Add the below value in environments where cluster name cannot be detected.
clusterName: remote-cluster
collectors:
  #  Cluster is a K8s deployment EDOT collector focused on gathering telemetry
  #  at the cluster level (Kubernetes Events and cluster metrics).
  cluster:
    enabled: true
    fullnameOverride: "opentelemetry-kube-stack-cluster-stats"
    replicas: 1
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
    env:
      - name: ELASTIC_AGENT_OTEL
        value: '"true"'
    config:
      exporters:
        # [Debug exporter](https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/debugexporter/README.md)
        debug:
          verbosity: basic # Options: basic, detailed. Choose verbosity level for debug logs.
          # [Elasticsearch exporter](https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/exporter/elasticsearchexporter/README.md)
        otlp_grpc/gateway:
          endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4317"
          tls:
            insecure: true
        elasticsearch/_agent-component/default:
          api_key: aUcyVGJaNEJsWV9sN0RoaDJ2Y046ODlOMHYyX2xCUFdVd0JRVmllaE51dw==
          compression: gzip
          compression_params:
              level: 1
          endpoints:
              - http://elasticsearch.lab:80
          logs_dynamic_id:
              enabled: true

          retry:
              enabled: true
              initial_interval: 1s
              max_interval: 1m0s
              max_retries: 3

          sending_queue:
              enabled: true
              wait_for_result: true
              block_on_overflow: true
              num_consumers: 1
              queue_size: 3200
              batch:
                  max_size: 1600
                  min_size: 0
                  flush_timeout: 10s
                  sizer: items
      extensions:
        cgroup_runtime: {}
        file_storage:
          directory: /var/lib/otelcol-scratch
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 1450
          spike_limit_mib: 290
          limit_percentage: 75
          spike_limit_percentage: 10
        # [Batch Processor](https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/batchprocessor)
        # inherit any values from helm chart
        batch: {}
        # [Resource Detection Processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourcedetectionprocessor)
        resourcedetection/eks:
          # Detects resources from environment variables and EKS (Elastic Kubernetes Service).
          detectors: [env, eks]
          timeout: 15s
          override: true
          eks:
            resource_attributes:
              k8s.cluster.name:
                enabled: true
        resourcedetection/gcp:
          # Detects resources from environment variables and GCP (Google Cloud Platform).
          detectors: [env, gcp]
          timeout: 2s
          override: true
        resourcedetection/aks:
          # Detects resources from environment variables and AKS (Azure Kubernetes Service).
          detectors: [env, aks]
          timeout: 2s
          override: true
          aks:
            resource_attributes:
              k8s.cluster.name:
                enabled: true
        resource/hostname:
          attributes:
            - key: host.name
              from_attribute: k8s.node.name
              action: upsert
        # [K8s Attributes Processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor)
        k8s_attributes:
          passthrough: false # Annotates resources with the pod IP and does not try to extract any other metadata.
          pod_association:
            # Below association takes a look at the k8s.pod.ip and k8s.pod.uid resource attributes or connection's context, and tries to match it with the pod having the same attribute.
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            - sources:
                - from: connection
          extract:
            metadata:
              - "k8s.namespace.name"
              - "k8s.deployment.name"
              - "k8s.replicaset.name"
              - "k8s.statefulset.name"
              - "k8s.daemonset.name"
              - "k8s.cronjob.name"
              - "k8s.job.name"
              - "k8s.node.name"
              - "k8s.pod.name"
              - "k8s.pod.ip"
              - "k8s.pod.uid"
              - "k8s.pod.start_time"
              # Service attributes added based on https://opentelemetry.io/docs/specs/semconv/non-normative/k8s-attributes/#service-attributes
              - "service.name"
              - "service.version"
              - "service.instance.id"
        transform/route-metricbeat:
          error_mode: ignore
          log_statements:
            - context: resource
              statements:
                - set(attributes["elasticsearch.index"], "metricbeat-9.4.2")
      receivers:
        # [K8s Events Receiver](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/k8seventsreceiver)
        k8s_events: {}
        # [K8s Cluster Receiver](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/k8sclusterreceiver)
        k8s_cluster:
          collection_interval: 60s
          auth_type: serviceAccount # Determines how to authenticate to the K8s API server. This can be one of none (for no auth), serviceAccount (to use the standard service account token provided to the agent pod), or kubeConfig to use credentials from ~/.kube/config.
          node_conditions_to_report:
            - Ready
            - MemoryPressure
          allocatable_types_to_report:
            - cpu
            - memory
          metrics:
            k8s.pod.status_reason:
              enabled: true
          resource_attributes:
            k8s.kubelet.version:
              enabled: true
            os.description:
              enabled: true
            os.type:
              enabled: true
            k8s.container.status.last_terminated_reason:
              enabled: true
        metricbeatreceiver:
          metricbeat:
            modules:
              - module: kubernetes
                period: 1m
                metricsets:
                  - state_node
                  - state_daemonset
                  - state_deployment
                  - state_replicaset
                  - state_statefulset
                  - state_pod
                  - state_container
                hosts: ["kube-state-metrics:8080"]
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                ssl.verification_mode: none
                data_stream:
                  dataset: kubernetes
                index: metrics-kubernetes-default
                fields:
                  orchestrator.cluster.name: cluster-remoto
                fields_under_root: true
              - module: kubernetes
                enabled: true
                metricsets:
                  - event
                period: 60s
                fields:
                  orchestrator.cluster.name: cluster-remoto
                fields_under_root: true
          queue.mem.flush.timeout: 0s
      # [Service Section](https://opentelemetry.io/docs/collector/configuration/#service)
      service:
        extensions: [cgroup_runtime, file_storage]
        telemetry:
            resource:
              elastic.collector.group_name: "OTel Collector Group"
              elastic.collector.group: "otel-collector-group"
              service.namespace: "otel-collector-group"
              service.name: "otel-collector-group"
              service.instance.id: "cluster-collector"
            metrics:
              readers:
                - periodic:
                    exporter:
                      otlp:
                        protocol: "grpc"
                        endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4317"
            logs:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: "grpc"
                        endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4317"
            traces:
              processors:
                - batch:
                    exporter:
                      otlp:
                        protocol: "grpc"
                        endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4317"
        pipelines:
          metrics:
            exporters:
              - debug
              - otlp_grpc/gateway
            processors:
              - memory_limiter
              - batch
              - k8s_attributes
              # - resourcedetection/eks
              # - resourcedetection/gcp
              # - resourcedetection/aks
              # - resource/hostname
            receivers:
              - k8s_cluster
          logs:
            receivers:
              - k8s_events
            processors:
              - memory_limiter
              - batch
              # - resourcedetection/eks
              # - resourcedetection/gcp
              # - resourcedetection/aks
              # - resource/hostname
            exporters:
              - debug
              - otlp_grpc/gateway
          logs/metricbeatreceiver:
            receivers:
              - metricbeatreceiver
            processors:
              - memory_limiter
              - batch
              - transform/route-metricbeat
              # - resourcedetection/eks
              # - resourcedetection/gcp
              # - resourcedetection/aks
              # - resource/hostname
              # - resource/cloud
            exporters:
              - elasticsearch/_agent-component/default
          
  #  Daemon is a K8s daemonset EDOT collector focused on gathering telemetry at
  #  node level and exposing an OTLP endpoint for data ingestion.
  #  Auto-instrumentation SDKs will use this endpoint.
  daemon:
    enabled: true
    fullnameOverride: "opentelemetry-kube-stack-daemon"
    resources:
      limits:
        cpu: 1500m
        memory: 1500Mi
      requests:
        cpu: 100m
        memory: 500Mi
    env:
      - name: ELASTIC_AGENT_OTEL
        value: '"true"'
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    presets:
      logsCollection:
        enabled: true # Enable/disable the collection of node's logs.
        storeCheckpoints: true # Store checkpoints for log collection, allowing for resumption from the last processed log.
      kubernetesEvents:
        enabled: false
      clusterMetrics:
        enabled: false
    hostNetwork: true # Use the host's network namespace. This allows the daemon to access the network interfaces of the host directly.
    securityContext: # Run the daemon as the root user and group for proper metrics collection.
      runAsUser: 0
      runAsGroup: 0
    scrape_configs_file: "" # [Prometheus metrics](https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-kube-stack#scrape_configs_file-details)
    config:
      exporters:
        # [Debug exporter](https://github.com/open-telemetry/opentelemetry-collector/blob/main/exporter/debugexporter/README.md)
        debug:
          verbosity: basic
        otlp_grpc/gateway:
          endpoint: "http://opentelemetry-kube-stack-gateway-collector-headless:4317"
          tls:
            insecure: true
        elasticsearch/_agent-component/default:
          api_key: aUcyVGJaNEJsWV9sN0RoaDJ2Y046ODlOMHYyX2xCUFdVd0JRVmllaE51dw==
          compression: gzip
          compression_params:
              level: 1
          endpoints:
              - http://elasticsearch.lab:80
          logs_dynamic_id:
              enabled: true

          retry:
              enabled: true
              initial_interval: 1s
              max_interval: 1m0s
              max_retries: 3

          sending_queue:
              enabled: true
              wait_for_result: true
              block_on_overflow: true
              num_consumers: 1
              queue_size: 3200
              batch:
                  max_size: 1600
                  min_size: 0
                  flush_timeout: 10s
                  sizer: items
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 1450
          spike_limit_mib: 290
          limit_percentage: 75
          spike_limit_percentage: 10
        # [Batch Processor](https://github.com/open-telemetry/opentelemetry-collector/tree/main/processor/batchprocessor)
        # inherit any values from helm chart
        batch: {}
        batch/metrics:
          # explicitly set send_batch_max_size to 0, as splitting metrics requests may cause version_conflict_engine_exception in TSDB
          send_batch_max_size: 0
          timeout: 1s
        # Filter to drop debug logs from the file_log receiver to avoid large volume of debug logs being sent to the gateway.
        filter/debug-logs:
          error_mode: propagate
          log_conditions:
            - log.severity_number < SEVERITY_NUMBER_INFO and log.severity_number > 0
        # [Resource Detection Processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/resourcedetectionprocessor)
        resourcedetection/eks:
          # Detects resources from environment variables and EKS (Elastic Kubernetes Service).
          detectors: [env, eks]
          timeout: 15s
          override: true
          eks:
            resource_attributes:
              k8s.cluster.name:
                enabled: true
        resourcedetection/gcp:
          # Detects resources from environment variables and GCP (Google Cloud Platform).
          detectors: [env, gcp]
          timeout: 2s
          override: true
        resourcedetection/aks:
          # Detects resources from environment variables and AKS (Azure Kubernetes Service).
          detectors: [env, aks]
          timeout: 2s
          override: true
          aks:
            resource_attributes:
              k8s.cluster.name:
                enabled: true
        resource/hostname:
          attributes:
            - key: host.name
              from_attribute: k8s.node.name
              action: upsert
        resourcedetection/system:
          # Detects resources from the system and EC2 instances.
          detectors: ["system", "ec2"]
          system:
            hostname_sources: ["os"]
            resource_attributes:
              host.name:
                enabled: true
              host.id:
                enabled: false
              host.arch:
                enabled: true
              # Disabling host.ip host.mac due to high cardinality
              # See issue: https://github.com/elastic/elastic-agent/issues/13575
              # host.ip:
              #   enabled: true
              # host.mac:
              #   enabled: true
              host.cpu.vendor.id:
                enabled: true
              host.cpu.family:
                enabled: true
              host.cpu.model.id:
                enabled: true
              host.cpu.model.name:
                enabled: true
              host.cpu.stepping:
                enabled: true
              host.cpu.cache.l2.size:
                enabled: true
              os.description:
                enabled: true
              os.type:
                enabled: true
          ec2:
            resource_attributes:
              host.name:
                enabled: false
              host.id:
                enabled: true
        resource/cloud:
          attributes:
            - key: cloud.instance.id
              from_attribute: host.id
              action: insert
        resource/cluster-name:
          attributes:
            - key: k8s.cluster.name
              value: "remote-cluster"
              action: upsert
        # [K8s Attributes Processor](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor)
        k8s_attributes:
          filter:
            # Only retrieve pods running on the same node as the collector
            node_from_env_var: OTEL_K8S_NODE_NAME
          passthrough: false
          pod_association:
            # Below association takes a look at the k8s.pod.ip and k8s.pod.uid resource attributes or connection's context, and tries to match it with the pod having the same attribute.
            - sources:
                - from: resource_attribute
                  name: k8s.pod.ip
            - sources:
                - from: resource_attribute
                  name: k8s.pod.uid
            - sources:
                - from: connection
          extract:
            metadata:
              - "k8s.namespace.name"
              - "k8s.deployment.name"
              - "k8s.replicaset.name"
              - "k8s.statefulset.name"
              - "k8s.daemonset.name"
              - "k8s.cronjob.name"
              - "k8s.job.name"
              - "k8s.node.name"
              - "k8s.pod.name"
              - "k8s.pod.ip"
              - "k8s.pod.uid"
              - "k8s.pod.start_time"
              # Service attributes added based on https://opentelemetry.io/docs/specs/semconv/non-normative/k8s-attributes/#service-attributes
              - "service.name"
              - "service.version"
              - "service.instance.id"
        transform/ecs-mode:
          log_statements:
            - context: scope
              statements:
                - set(attributes["elastic.mapping.mode"], "ecs")
        transform/route-python-app:
          error_mode: ignore
          log_statements:
            - context: resource
              statements:
                - set(attributes["elasticsearch.index"], "akslogs")
        transform/route-metricbeat:
          error_mode: ignore
          log_statements:
            - context: resource
              statements:
                - set(attributes["elasticsearch.index"], "metricbeat-9.4.2")
        tail_sampling:
          sampling_strategy: span-ingest
          decision_wait: 10s
          num_traces: 100
          expected_new_traces_per_sec: 10
          sample_on_first_match: true
          decision_cache: 
            sampled_cache_size: 1000
          policies: [
            # Sample 20% of all traces
             {
            name: test-policy-4,
            type: probabilistic,
            probabilistic: {sampling_percentage: 20}
            }
          ]
      receivers:
        # [OTLP Receiver](https://github.com/open-telemetry/opentelemetry-collector/tree/main/receiver/otlpreceiver)
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        # [File Log Receiver](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/filelogreceiver)
        file_log:
          retry_on_failure:
            enabled: true
          start_at: end
          exclude:
            # exlude collector logs
            - /var/log/pods/*opentelemetry-kube-stack*/*/*.log
          include:
            - /var/log/pods/*/*/*.log
          include_file_name: false
          include_file_path: true
          operators:
            - id: container-parser # Extract container's metadata
              type: container
            - id: json-parser # Parse logs in JSON format
              type: json_parser
              if: 'body matches "^{.*}$"'
              parse_from: body
              severity:
                parse_from: attributes.level
                mapping:
                  debug: [debug, DEBUG, trace, TRACE]
                  info: [info, INFO]
                  warn: [warn, WARN, warning, WARNING]
                  error: [error, ERROR]
                  fatal: [fatal, FATAL]
            - id: timestamp-parser # Parse timestamp from 'ts' field (only if present)
              type: time_parser
              if: 'attributes.ts != nil'
              parse_from: attributes.ts
              layout: '%Y-%m-%dT%H:%M:%S%z'
        metricbeatreceiver:
          metricbeat:
            modules:
              - data_stream:
                  dataset: system.cpu
                index: metrics-system.cpu-default
                metricsets:
                  - cpu
                module: system

              - module: kubernetes
                period: 1m
                metricsets:
                  - container
                  - node
                  - pod
                  - system
                  - volume
                hosts: ["https://${env:OTEL_K8S_NODE_NAME}:10250"]
                bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                ssl.verification_mode: none
                data_stream:
                  dataset: kubernetes
                index: metrics-kubernetes-default
                fields:
                  orchestrator.cluster.name: cluster-remoto
                fields_under_root: true
          queue.mem.flush.timeout: 0s
        # [Hostmetrics Receiver](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/hostmetricsreceiver)
        hostmetrics:
          collection_interval: 60s
          root_path: /hostfs # Mounted node's root file system
          scrapers:
            cpu:
              metrics:
                system.cpu.utilization:
                  enabled: true
                system.cpu.logical.count:
                  enabled: true
            memory:
              metrics:
                system.memory.utilization:
                  enabled: true
            # process scraper is disabled for now: https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/39423
            #process:
            #  mute_process_exe_error: true
            #  mute_process_io_error: true
            #  mute_process_user_error: true
            #  metrics:
            #    process.threads:
            #      enabled: true
            #    process.open_file_descriptors:
            #      enabled: true
            #    process.memory.utilization:
            #      enabled: true
            #    process.disk.operations:
            #      enabled: true
            network: {}
            processes: {}
            load: {}
            disk: {}
            filesystem:
              exclude_mount_points:
                mount_points:
                  - /dev/*
                  - /proc/*
                  - /sys/*
                  - /run/k3s/containerd/*
                  - /var/lib/docker/*
                  - /var/lib/kubelet/*
                  - /snap/*
                match_type: regexp
              exclude_fs_types:
                fs_types:
                  - autofs
                  - binfmt_misc
                  - bpf
                  - cgroup2
                  - configfs
                  - debugfs
                  - devpts
                  - devtmpfs
                  - fusectl
                  - hugetlbfs
                  - iso9660
                  - mqueue
                  - nsfs
                  - overlay
                  - proc
                  - procfs
                  - pstore
                  - rpc_pipefs
                  - securityfs
                  - selinuxfs
                  - squashfs
                  - sysfs
                  - tracefs
                match_type: strict
        # [Kubelet Stats Receiver](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/kubeletstatsreceiver)
        kubeletstats:
          auth_type: serviceAccount # Authentication mechanism with the Kubelet endpoint, refer to: https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/kubeletstatsreceiver#configuration
          collection_interval: 60s
          endpoint: ${env:OTEL_K8S_NODE_NAME}:10250
          node: '${env:OTEL_K8S_NODE_NAME}'
          # Required to work for all CSPs without an issue
          insecure_skip_verify: true
          k8s_api_config:
            auth_type: serviceAccount
          metric_groups:
            - node
            - pod
            - container
            - volume
          metrics:
            k8s.pod.memory.node.utilization:
              enabled: true
            k8s.pod.cpu.node.utilization:
              enabled: true
            k8s.container.cpu_limit_utilization:
              enabled: true
            k8s.pod.cpu_limit_utilization:
              enabled: true
            k8s.container.cpu_request_utilization:
              enabled: true
            k8s.container.memory_limit_utilization:
              enabled: true
            k8s.pod.memory_limit_utilization:
              enabled: true
            k8s.container.memory_request_utilization:
              enabled: true
            # k8s.node.uptime:
            #   enabled: true
            # k8s.node.cpu.usage:
            #   enabled: true
            k8s.pod.cpu.usage:
              enabled: true
          extra_metadata_labels:
            - container.id
      extensions:
        cgroup_runtime: {}
        file_storage:
          directory: /var/lib/otelcol-scratch
      # [Service Section](https://opentelemetry.io/docs/collector/configuration/#service)
      service:
        extensions: [cgroup_runtime, file_storage]
        pipelines:
          # Disable default non used kube-stack Helm Chart pipelines
          logs: null
          metrics: null
          traces: null
          logs/metricbeatreceiver:
            receivers:
              - metricbeatreceiver
            processors:
              - memory_limiter
              - batch
              - transform/route-metricbeat
              # - resourcedetection/eks
              # - resourcedetection/gcp
              # - resourcedetection/aks
              # - resource/hostname
              # - resource/cloud
            exporters:
              - elasticsearch/_agent-component/default
          logs/node:
            receivers:
              - file_log
            processors:
              - memory_limiter
              - filter/debug-logs
              - batch
              - k8s_attributes
              - transform/ecs-mode
              - resourcedetection/system
              # - resourcedetection/eks
              # - resourcedetection/gcp
              # - resourcedetection/aks
              # - resource/hostname
              # - resource/cloud
              - resource/cluster-name
              - transform/route-python-app
            exporters:
              - otlp_grpc/gateway
          metrics/node/otel:
            receivers:
              - kubeletstats
              - hostmetrics
            processors:
              - memory_limiter
              - batch/metrics
              - k8s_attributes
              - resourcedetection/system
              # - resourcedetection/eks
              # - resourcedetection/gcp
              # - resourcedetection/aks
              # - resource/hostname
              # - resource/cloud
              - resource/cluster-name
            exporters:
              # - debug
              - otlp_grpc/gateway
          metrics/otel-apm:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - batch/metrics
              # - resource/hostname
              - resource/cluster-name
            exporters:
              - otlp_grpc/gateway
          logs/apm:
            receivers:
              - otlp
            processors:
              - memory_limiter
              - batch
              - transform/ecs-mode
              - resource/hostname
              - resource/cluster-name
            exporters:
              - otlp_grpc/gateway
          traces/apm:
            receivers:
              - otlp
            processors:
              - memory_limiter
              # - tail_sampling
              - batch
              - resource/hostname
              - resource/cluster-name
            exporters:
              - otlp_grpc/gateway
  #  Gateway is a K8s deployment EDOT collector focused on processing and
  #  forwarding telemetry to an Elasticsearch endpoint.
  gateway:
    fullnameOverride: "opentelemetry-kube-stack-gateway"
    # Uncomment to enable central config in Kibana APM
    # ports:
    #   - name: opamp-http
    #     protocol: TCP
    #     port: 4320
    #     targetPort: 4320
    resources:
      limits:
        cpu: 1500m
        memory: 1500Mi
      requests:
        cpu: 100m
        memory: 500Mi
    suffix: gateway
    replicas: 1
    enabled: true
    env:
      - name: ELASTIC_AGENT_OTEL
        value: '"true"'
      - name: ELASTIC_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: elastic-secret-otel
            key: elastic_endpoint
      - name: ELASTIC_API_KEY
        valueFrom:
          secretKeyRef:
            name: elastic-secret-otel
            key: elastic_api_key
      - name: GOMAXPROCS
        valueFrom:
          resourceFieldRef:
            resource: limits.cpu
      - name: GOMEMLIMIT
        value: "1025MiB"
    config:
      connectors:
        # [Elastic APM Connector](https://github.com/elastic/opentelemetry-collector-components/tree/main/connector/elasticapmconnector)
        elasticapm: 
          aggregation:
            limits:
              resource: 
                max_cardinality: 8000
              scope:
                max_cardinality: 4000
              metric:
                max_cardinality: 4000
              datapoint:
                max_cardinality: 4000
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: ${env:OTEL_K8S_POD_IP}:4317
            http:
              endpoint: ${env:OTEL_K8S_POD_IP}:4318
      processors:
        memory_limiter:
          check_interval: 1s
          limit_mib: 1450
          spike_limit_mib: 290
          limit_percentage: 75
          spike_limit_percentage: 10
        batch:
          send_batch_size: 1000
          timeout: 1s
          send_batch_max_size: 1500
        batch/metrics:
          # explicitly set send_batch_max_size to 0, as splitting metrics requests may cause version_conflict_engine_exception in TSDB
          send_batch_max_size: 0
          timeout: 1s
        # [Elastic APM Processor](https://github.com/elastic/opentelemetry-collector-components/tree/main/processor/elasticapmprocessor)
        # The processor enriches traces with elastic specific requirements.
        elasticapm: {}
        resource/cluster-name:
          attributes:
            - key: k8s.cluster.name
              value: remote-cluster
              action: upsert
        
      exporters:
        debug: {}
        # [Elasticsearch exporter](https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/main/exporter/elasticsearchexporter/README.md)
        elasticsearch/otel:
          endpoints: # List of Elasticsearch endpoints.
            - ${env:ELASTIC_ENDPOINT}
          api_key: ${env:ELASTIC_API_KEY} # API key for Elasticsearch authentication.
          # Enable in order to skip the SSL certificate Check
          # tls:
          #   insecure_skip_verify: true
          mapping:
            allowed_modes: [otel, ecs]
          # logs_index: "akslogs"
      extensions:
        cgroup_runtime: {}
        file_storage:
          directory: /var/lib/otelcol-scratch
        # Uncomment to enable central config in Kibana APM
        # bearertokenauth:
        #   scheme: "APIKey"
        #   token: ${env:ELASTIC_API_KEY}

        # apmconfig:
        #   opamp:
        #     protocols:
        #       http:
        #         # Default is localhost:4320
        #         # To specify a custom endpoint, uncomment the following line
        #         # and set the endpoint to the custom endpoint
        #         endpoint: ":4320"
        #   source:
        #     elasticsearch:
        #       endpoint: ${env:ELASTIC_ENDPOINT}
        #       auth:
        #         authenticator: bearertokenauth

      service:
        # To enable central config in Kibana APM add the extensions bearertokenauth and apmconfig
        extensions: [cgroup_runtime, file_storage]
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [memory_limiter, batch/metrics, resource/cluster-name]
            exporters: [debug, elasticsearch/otel]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, batch, resource/cluster-name]
            exporters: [debug, elasticapm, elasticsearch/otel]
          traces:
            receivers: [otlp]
            processors: [memory_limiter, batch, elasticapm, resource/cluster-name]
            exporters: [debug, elasticapm, elasticsearch/otel]
          metrics/aggregated-otel-metrics:
            receivers:
              - elasticapm
            processors: [memory_limiter, resource/cluster-name]
            exporters:
              - debug
              - elasticsearch/otel
  #  Prometheus collector — consumes existing kube-prometheus-stack ServiceMonitor / PodMonitor / Probe
  #  CRDs via the OpenTelemetry Operator's TargetAllocator and writes to a Thanos Receive endpoint.
  #  Runs in StatefulSet mode and uses the upstream OTel Collector Contrib image
  #  (no Elastic-specific components needed for this pipeline).
  prometheus:
    mode: statefulset
    enabled: true
    replicas: 1
    suffix: prom
    fullnameOverride: "opentelemetry-kube-stack-prometheus"
    image:
      repository: "otel/opentelemetry-collector-contrib"
      tag: "0.153.0"
    resources:
      limits:
        cpu: 1
        memory: 1Gi
      requests:
        cpu: 200m
        memory: 512Mi
    # TargetAllocator discovers targets from kube-prometheus-stack CRDs and distributes them across
    # collector replicas. Selector mirrors the existing Prometheus Agent's serviceMonitorSelector.
    targetAllocator:
      enabled: true
      replicas: 1
      allocationStrategy: consistent-hashing
      filterStrategy: relabel-config
      # serviceAccount: opentelemetry-kube-stack-prometheus-targetallocator
      resources:
        limits:
          cpu: 200m
          memory: 256Mi
        requests:
          cpu: 50m
          memory: 64Mi
      prometheusCR:
        enabled: true
        scrapeInterval: 60s
        serviceMonitorSelector:
          matchExpressions:
            - key: release
              operator: In
              values:
                - otel
                - prometheus
    config:
      receivers:
        prometheus:
          config:
            # Strategy B: self-contained kubelet scraping translated from the
            # kube-prometheus-stack `prometheus-kube-prometheus-kubelet` ServiceMonitor.
            # Uses `role: node` SD (one target per node, address defaults to <nodeIP>:10250),
            # so it does NOT depend on prometheus-operator maintaining a kubelet Service/Endpoints.
            # The TargetAllocator performs discovery and shards targets across collector replicas,
            # so NO hashmod/$(SHARD) relabeling is needed here.
            scrape_configs:
              # ServiceMonitor endpoint #1 -> kubelet /metrics
              - job_name: kubelet
                scheme: https
                scrape_interval: 30s
                honor_labels: true
                honor_timestamps: true
                authorization:
                  type: Bearer
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  # jobLabel: k8s-app on the SM -> all kubelet endpoints share job="kubelet"
                  - action: replace
                    target_label: job
                    replacement: kubelet
                  - action: replace
                    source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                  - action: replace
                    source_labels: [__metrics_path__]
                    target_label: metrics_path
                metric_relabel_configs:
                  - action: drop
                    source_labels: [__name__, le]
                    regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
              # ServiceMonitor endpoint #2 -> kubelet /metrics/cadvisor
              - job_name: kubelet-cadvisor
                scheme: https
                metrics_path: /metrics/cadvisor
                scrape_interval: 30s
                honor_labels: true
                honor_timestamps: true
                track_timestamps_staleness: true
                authorization:
                  type: Bearer
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  - action: replace
                    target_label: job
                    replacement: kubelet
                  - action: replace
                    source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                  - action: replace
                    source_labels: [__metrics_path__]
                    target_label: metrics_path
                metric_relabel_configs:
                  - action: drop
                    source_labels: [__name__]
                    regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
                  - action: drop
                    source_labels: [__name__]
                    regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
                  - action: drop
                    source_labels: [__name__]
                    regex: container_memory_(mapped_file|swap)
                  - action: drop
                    source_labels: [__name__]
                    regex: container_(file_descriptors|tasks_state|threads_max)
                  - action: drop
                    source_labels: [__name__, scope]
                    regex: container_memory_failures_total;hierarchy
                  - action: drop
                    source_labels: [__name__, interface]
                    regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
                  - action: drop
                    source_labels: [__name__]
                    regex: container_spec.*
                  - action: drop
                    source_labels: [id, pod]
                    regex: .+;
              # ServiceMonitor endpoint #3 -> kubelet /metrics/probes
              - job_name: kubelet-probes
                scheme: https
                metrics_path: /metrics/probes
                scrape_interval: 30s
                honor_labels: true
                honor_timestamps: true
                authorization:
                  type: Bearer
                  credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
                tls_config:
                  ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  insecure_skip_verify: true
                kubernetes_sd_configs:
                  - role: node
                relabel_configs:
                  - action: replace
                    target_label: job
                    replacement: kubelet
                  - action: replace
                    source_labels: [__meta_kubernetes_node_name]
                    target_label: node
                  - action: replace
                    source_labels: [__metrics_path__]
                    target_label: metrics_path
          target_allocator:
            endpoint: http://opentelemetry-kube-stack-prometheus-targetallocator:8080
            interval: 35s
            collector_id: ${env:POD_NAME}
      processors:
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          send_batch_size: 2000
          send_batch_max_size: 2000
          timeout: 10s
      exporters:
        debug:
          verbosity: basic
        # [Prometheus Remote Write exporter](https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/exporter/prometheusremotewriteexporter)
        prometheusremotewrite/thanos:
          endpoint: "http://receiver.lab/api/v1/receive"
          tls:
            insecure: true
          timeout: 10s
          # Preserve metric names verbatim — no _total/_seconds suffix munging.
          add_metric_suffixes: false
          # Promote OTel resource attributes to Prometheus labels.
          resource_to_telemetry_conversion:
            enabled: true
          external_labels:
            cluster: "remote-cluster"
            # `source` lets us distinguish OTel-scraped vs Prometheus-Agent-scraped series in Thanos
            # during the side-by-side parity window. Remove once Prometheus Agent is decommissioned.
            source: "otel"
          remote_write_queue:
            enabled: true
            queue_size: 20000
            num_consumers: 10
          retry_on_failure:
            enabled: true
            initial_interval: 100ms
            max_interval: 10s
            max_elapsed_time: 5m
      service:
        telemetry:
          metrics:
            level: detailed
        pipelines:
          metrics:
            receivers: [prometheus]
            processors: [memory_limiter, batch]
            exporters: [prometheusremotewrite/thanos, debug]
  loki:
    enabled: false
    mode: daemon
    fullnameOverride: "opentelemetry-kube-stack-loki"
    image:
      repository: "otel/opentelemetry-collector-contrib"
      tag: "0.153.0"
    resources:
      limits:
        cpu: 1000m
        memory: 512Mi
      requests:
        cpu: 200m
        memory: 256Mi
    presets:
      logsCollection:
        enabled: true
        storeCheckpoints: true
      kubernetesAttributes:
        enabled: true
    config:
      processors:
        memory_limiter:
          check_interval: 5s
          limit_percentage: 80
          spike_limit_percentage: 25
        batch:
          send_batch_size: 2000
          send_batch_max_size: 2000
          timeout: 10s
      exporters:
        otlphttp/loki:
          endpoint: http://<loki-addr>/otlp
      service:
        pipelines:
          logs:
            processors: [memory_limiter, batch]
            exporters: [otlphttp/loki]
      
# For more details on OpenTelemetry's zero-code instrumentation, see:
# https://opentelemetry.io/docs/concepts/instrumentation/zero-code/
instrumentation:
  name: elastic-instrumentation
  enabled: true # Enable/disable auto-instrumentation.
  env: []
  exporter:
    endpoint: http://opentelemetry-kube-stack-daemon-collector.otel-system.svc.cluster.local:4318 # The daemonset OpenTelemetry Collector endpoint where telemetry data will be exported.
  propagators:
    - tracecontext # W3C TraceContext propagator for distributed tracing.
    - baggage # Baggage propagator to include baggage information in trace context.
    - b3 # B3 propagator for Zipkin-based distributed tracing compatibility.
  sampler:
    type: parentbased_traceidratio # Sampler type
    argument: "0.2" # Sampling rate set to 100% (all traces are sampled).
  java:
    image: docker.elastic.co/observability/elastic-otel-javaagent:1.11.0
  nodejs:
    image: docker.elastic.co/observability/elastic-otel-node:1.11.0
  dotnet:
    image: docker.elastic.co/observability/elastic-otel-dotnet:1.4.0
  python:
    image: docker.elastic.co/observability/elastic-otel-python:1.12.0
    # Uncomment to enable central config in Kibana APM
    # env:
