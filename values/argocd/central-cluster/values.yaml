
global:
  domain: argocd.lab
  revisionHistoryLimit: 1

  image:
    repository: quay.io/argoproj/argocd
    tag: v3.4.1
    imagePullPolicy: IfNotPresent

  # Default logging options used by all components
  logging:
    format: json
    # -- Set the global logging level. One of: `debug`, `info`, `warn` or `error`
    level: info

configs:
  # General Argo CD configuration
  ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cm.yaml
  cm:
    url: http://argocd.lab

     # -- Timeout to discover if a new manifests version got published to the repository
    timeout.reconciliation: 3600s #180s

    # -- Maximum jitter added to the reconciliation timeout to spread out refreshes and reduce repo-server load
    timeout.reconciliation.jitter: 60s

    accounts.manu: login
    accounts.fran: login
    
  # An optional comma-separated list of node labels to propagate to the application pod view.
  application.allowedNodeLabels: topology.kubernetes.io/zone,node.kubernetes.io/instance-type

  # Argo CD configuration parameters
  ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/argocd-cmd-params-cm.yaml
  params:
    # Number of application status processors (default 20)
    controller.status.processors: "20"
    # Number of application operation processors (default 10)
    controller.operation.processors: "10"
    # Sharding algorithm used to balance clusters across application controller shards (default "legacy")
    controller.sharding.algorithm: consistent-hashing
    # Run server without TLS
    server.insecure: true
    # Limit on number of concurrent manifests generate requests. Any value less the 1 means no limit.
    reposerver.parallelism.limit: "1"
    # # Enables profile endpoint on the internal metrics port
    # controller.profile.enabled: "false"
    # # Enables profile endpoint on the internal metrics port
    # server.profile.enabled: "false"
    # # Enables profile endpoint on the internal metrics port
    # reposerver.profile.enabled: "false"
    # # Enables profile endpoint on the internal metrics port
    # applicationsetcontroller.profile.enabled: "false"  

    # -- Repo server RPC call timeout seconds.
    controller.repo.server.timeout.seconds: "60"
  
    # Number of allowed concurrent kubectl fork/execs. Any value less than 1 means no limit.
    controller.kubectl.parallelism.limit: "20"

  # Argo CD RBAC policy configuration
  ## Ref: https://github.com/argoproj/argo-cd/blob/master/docs/operator-manual/rbac.md
  rbac:
    policy.csv: |
      p, role:developers, applications, get, apps/*, allow
      p, role:topolvm_operators, applications, *, addons/topolvm-*, allow

      g, manu, role:developers
      g, fran, role:topolvm_operators

## Application controller
controller:
  # -- Application controller name string
  name: application-controller

  # -- The number of application controller pods to run.
  # Additional replicas will cause sharding of managed clusters across number of replicas.
  ## With dynamic cluster distribution turned on, sharding of the clusters will gracefully
  ## rebalance if the number of replica's changes or one becomes unhealthy. (alpha)
  replicas: 2

  # -- Enable dynamic cluster distribution (alpha)
  # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/dynamic-cluster-distribution
  ## This is done using a deployment instead of a statefulSet
  ## When replicas are added or removed, the sharding algorithm is re-run to ensure that the
  ## clusters are distributed according to the algorithm. If the algorithm is well-balanced,
  ## like round-robin, then the shards will be well-balanced.
  dynamicClusterDistribution: false

  # -- Application controller heartbeat time
  # Ref: https://argo-cd.readthedocs.io/en/stable/operator-manual/dynamic-cluster-distribution/#working-of-dynamic-distribution
  heartbeatTime: 10
  
  pdb:
    enabled: true
    minAvailable: 1

  resources: {}
  #  limits:
  #    cpu: 500m
  #    memory: 512Mi
  #  requests:
  #    cpu: 250m
  #    memory: 256Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

## Dex
dex:
  # -- Enable dex
  enabled: true
  # -- Dex name
  name: dex-server

  # -- Additional command line arguments to pass to the Dex server
  extraArgs: []

  # -- Runtime class name for Dex
  # @default -- `""` (defaults to global.runtimeClassName)
  runtimeClassName: ""

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus

  ## Dex image
  image:
    # -- Dex image repository
    repository: ghcr.io/dexidp/dex
    # -- Dex image tag
    tag: v2.45.1
    # -- Dex imagePullPolicy
    # @default -- `""` (defaults to global.image.imagePullPolicy)
    imagePullPolicy: ""

  # -- Secrets with credentials to pull images from a private registry
  # @default -- `[]` (defaults to global.imagePullSecrets)
  imagePullSecrets: []
  # -- Resource limits and requests for dex
  resources: {}
  #  limits:
  #    cpu: 50m
  #    memory: 64Mi
  #  requests:
  #    cpu: 10m
  #    memory: 32Mi


