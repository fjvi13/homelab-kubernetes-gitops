prometheus:
  fullnameOverride: "prometheus-agent"
  agentMode: true
  prometheusSpec:
    scrapeInterval: "60s"
    replicas: 1
    replicaExternalLabelName: "prometheus_replica"
    serviceMonitorSelector:
      matchExpressions:
        - key: release
          operator: In
          values:
            - thanos
            - prometheus
    externalLabels:
      cluster: "central-cluster"
    remoteWrite:
    - url: http://thanos-receive.monitoring.svc.cluster.local:10908/api/v1/receive
      # headers:
      #   THANOS-TENANT: "central-cluster-dev"
      queueConfig:
        capacity: 10000
        maxShards: 50
        minShards: 1
        maxSamplesPerSend: 5000
        batchSendDeadline: 5s
        minBackoff: 30ms
        maxBackoff: 5s
      # Aumentar timeout para evitar "context deadline exceeded"
      remoteTimeout: 30s
      sendExemplars: false
    serviceDiscoveryRole: "EndpointSlice"
    resources: {}
      # limits:
      #   cpu: 1
      #   memory: 1Gi
      # requests:
      #   cpu: 500m
      #   memory: 512Mi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow

thanosRuler:
  enabled: true

  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    unhealthyPodEvictionPolicy: AlwaysAllow

  route:
    main:
      enabled: false
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute

      annotations: {}
      labels: {}

      hostnames:
        - ruler.lab
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: lab-gateway
          namespace: istio-system
          sectionName: http
      httpsRedirect: false

      matches:
        - path:
            type: PathPrefix
            value: /
      filters: []
      additionalRules: []

  serviceMonitor:
    selfMonitor: true
    
  thanosRulerSpec:
    image:
      registry: quay.io
      repository: thanos/thanos
      tag: v0.39.2
      sha: ""

    ## If true, a nil or {} value for thanosRuler.thanosRulerSpec.ruleSelector will cause the
    ## prometheus resource to be created with selectors based on values in the helm deployment,
    ## which will also match the PrometheusRule resources created
    ##
    ruleSelectorNilUsesHelmValues: true
    ruleSelector:
      matchExpressions:
        - key: release
          operator: In
          values:
            - thanos
            - prometheus

    logFormat: logfmt
    logLevel: info
    replicas: 1
    evaluationInterval: 1m

    storage: {}

    alertmanagersConfig:
      secret:
        alertmanagers:
          - static_configs:
              - dns+alertmanager-operated.monitoring.svc.cluster.local:9093
            scheme: http
            api_version: v2
            timeout: 10s

    ## If true, http://{{ template "kube-prometheus-stack.thanosRuler.name" . }}.{{ template "kube-prometheus-stack.namespace" . }}:{{ .Values.thanosRuler.service.port }}
    ## will be used as value for externalPrefix
    externalPrefixNilUsesHelmValues: true

    ## The route prefix ThanosRuler registers HTTP handlers for. This is useful, if using ExternalURL and a proxy is rewriting HTTP routes of a request, and the actual ExternalURL is still true,
    ## but the server serves requests under a different route prefix. For example for use with kubectl proxy.
    ##
    routePrefix: /

    ## Labels by name to drop before sending to alertmanager
    ## Maps to the --alert.label-drop flag of thanos ruler.
    alertDropLabels: []

    ## QueryEndpoints defines Thanos querier endpoints from which to query metrics.
    ## Maps to the --query flag of thanos ruler.
    queryEndpoints: [dnssrv+_http._tcp.thanos-query.monitoring.svc.cluster.local]

    ## Labels configure the external label pairs to ThanosRuler. A default replica
    ## label `thanos_ruler_replica` will be always added as a label with the value
    ## of the pod's name and it will be dropped in the alerts.
    labels: {}

    ## If set to true all actions on the underlying managed objects are not going to be performed, except for delete actions.
    ##
    paused: false

    additionalArgs:
      - name: alert.query-url
        value: "http://query.lab"
      - name: remote-write.config
        value: |-
          "remote_write":
          - "name": "receiver"
            "remote_timeout": "30s"
            "url": "http://thanos-receive.monitoring.svc.cluster.local:10908/api/v1/receive"
            "queue_config":
              "capacity": 500
              "max_shards": 30
              "max_samples_per_send": 200

    resources: {}
    # requests:
    #   memory: 400Mi
