prometheus:
  fullnameOverride: "prometheus-agent"
  agentMode: true
  prometheusSpec:
    scrapeInterval: "60s"
    replicas: 1
    replicaExternalLabelName: "prometheus_replica"
    serviceMonitorSelector:
      matchExpressions:
        - key: release
          operator: In
          values:
            - thanos
            - prometheus
    externalLabels:
      cluster: "central-cluster"
    remoteWrite:
    - url: http://thanos-receive.monitoring.svc.cluster.local:10908/api/v1/receive
      # headers:
      #   THANOS-TENANT: "central-cluster-dev"
      queueConfig:
        capacity: 10000
        maxShards: 50
        minShards: 1
        maxSamplesPerSend: 5000
        batchSendDeadline: 5s
        minBackoff: 30ms
        maxBackoff: 5s
      # Aumentar timeout para evitar "context deadline exceeded"
      remoteTimeout: 30s
      sendExemplars: false
    serviceDiscoveryRole: "EndpointSlice"
    resources: {}
      # limits:
      #   cpu: 1
      #   memory: 1Gi
      # requests:
      #   cpu: 500m
      #   memory: 512Mi

