crds:
  enabled: true

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    configReloaders: false
    general: false
    k8sContainerCpuUsageSecondsTotal: false
    k8sContainerMemoryCache: false
    k8sContainerMemoryRss: false
    k8sContainerMemorySwap: false
    k8sContainerResource: false
    k8sContainerMemoryWorkingSetBytes: false
    k8sPodOwner: false
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false
    kubeApiserverHistogram: false
    kubeApiserverSlos: false
    kubeControllerManager: false
    kubelet: false
    kubeProxy: false
    kubePrometheusGeneral: false
    kubePrometheusNodeRecording: false
    kubernetesApps: false
    kubernetesResources: false
    kubernetesStorage: false
    kubernetesSystem: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeStateMetrics: false
    network: false
    node: false
    nodeExporterAlerting: false
    nodeExporterRecording: false
    prometheus: true
    prometheusOperator: true
    windows: false

alertmanager:
  enabled: true
  fullnameOverride: "alertmanager"
  service:
    enabled: true
    port: 9093
    type: ClusterIP
  serviceMonitor:
    selfMonitor: true
    interval: ""
  alertmanagerSpec:
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.28.1
      sha: ""
      pullPolicy: IfNotPresent
    replicas: 1
    ## Time duration Alertmanager shall retain data for. Default is '120h', and must match the regular expression
    ## [0-9]+(ms|s|m|h) (milliseconds seconds minutes hours).
    ##
    retention: 120h
    resources: {}

grafana:
  enabled: false
  adminUser: labuser
  adminPassword: labpassword
  ingress:
    enabled: true
    hosts: 
      - grafana2.lab
  sidecar:
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      name: Prometheus
      uid: prometheus
      url: http://thanos-query-frontend.monitoring.svc.cluster.local:9090

kubelet:
  enabled: true
  namespace: kube-system
  serviceMonitor:
    interval: "30s"

kube-state-metrics:
  fullnameOverride: "kube-state-metrics"
  prometheus:
    monitor:
      enabled: true
      interval: ""

nodeExporter:
  enabled: true
prometheus-node-exporter:
  fullnameOverride: "node-exporter"
  prometheus:
    monitor:
      enabled: true
      interval: "30s"

prometheusOperator:
  fullnameOverride: "prometheus-operator"

  resources:
    limits:
      cpu: 400m
      memory: 600Mi
    requests:
      cpu: 200m
      memory: 300Mi

  ## Create Endpoints objects for kubelet targets.
  kubeletEndpointsEnabled: false
  ## Create EndpointSlice objects for kubelet targets.
  kubeletEndpointSliceEnabled: true

  prometheusConfigReloader:
    resources:
      requests:
        cpu: 200m
        memory: 50Mi
      limits:
        cpu: 200m
        memory: 50Mi

