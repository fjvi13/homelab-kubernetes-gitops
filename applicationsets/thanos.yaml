apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: thanos
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - server
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: enable_thanos
                    operator: In
                    values: ['true']
              values:
                chart: thanos
                chartRepository: https://charts.bitnami.com/bitnami
          - clusters:
              selector:
                matchLabels:
                  env: lab
              values:
                chartVersion: 17.3.1
  template:
    metadata:
      name: "thanos-{{.name}}"
    spec:
      project: addons
      sources:
        - repoURL: '{{ .values.chartRepository}}'
          targetRevision: '{{ .values.chartVersion}}'
          chart: '{{ .values.chart}}'
          helm:
            releaseName: thanos
            valueFiles:
              - $repo/values/thanos/{{ .name }}/values.yaml
        - repoURL: https://github.com/fjvi13/homelab-kubernetes-gitops.git
          targetRevision: HEAD
          ref: repo
      destination:
        name: '{{ .name }}'
        namespace: monitoring
      syncPolicy:
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true