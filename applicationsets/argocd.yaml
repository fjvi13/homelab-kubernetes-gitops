apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: argocd
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - server
        generators:
          - clusters:
              values:
                chart: argo-cd
                chartRepository: https://argoproj.github.io/argo-helm
              # selector:
              #   matchExpressions:
              #     - key: enable_argocd
              #       operator: In
              #       values: ['true']
          - clusters:
              selector:
                matchLabels:
                  cluster: central-cluster
                  env: lab
              values:
                chartVersion: 9.5.11 
  template:
    metadata:
      name: "argocd-{{.values.chartVersion}}-{{.name}}"
    spec:
      project: default
      sources:
        - repoURL: '{{ .values.chartRepository}}'
          targetRevision: '{{ .values.chartVersion}}'
          chart: '{{ .values.chart}}'
          helm:
            releaseName: argocd
            valueFiles:
              - $repo/values/{{ .name }}/values.yaml
        - repoURL: https://github.com/fjvi13/homelab-kubernetes-gitops.git
          targetRevision: HEAD
          ref: repo
      destination:
        name: '{{ .name }}'
        namespace: argocd
      syncPolicy:
        # automated:
        #   prune: true
        #   selfHeal: true
        syncOptions:
        - CreateNamespace=true
        - ServerSideApply=true