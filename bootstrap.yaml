apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  destination:
    name: central-cluster
    namespace: argocd
  source:
    repoURL: https://github.com/fjvi13/homelab-kubernetes-gitops.git
    targetRevision: HEAD
    path: applicationsets
    directory:
      recurse: true
  syncPolicy:
    automated: {}